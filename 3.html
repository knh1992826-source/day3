<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function plux(a,b){
            return a+b
        }
          function mi(a,b){
            return a-b
        }
        // head 안에서는 body가 아직 없으므로, 문서가 다 읽힌 뒤에 버튼에 이벤트를 연결한다.
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelector('button#a').addEventListener('click', function () {
    console.log(plux(4, 6));
});
    document.querySelector('button#b').addEventListener('click', function () {
    console.log(mi(4, 6));
});

        });
    </script>
</head>
<body>
    안녕하세요
    <h1>
        반갑습니다
    </h1>
    <h2>
        반갑습니다
    </h2>
    <button id="a">덧셈</button>
    <button id="b">뺄셈</button>
</body>
</html>
