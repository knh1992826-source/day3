<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixabay 이미지 슬라이더</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', sans-serif; background: #fff7ec; color: #333; padding: 24px 16px; }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { color: #ff6b35; text-align: center; margin-bottom: 16px; }
  .bar { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .bar input { flex: 1; min-width: 160px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
  button { padding: 10px 18px; border: none; border-radius: 8px; background: #ff9f1c; color: #fff; font-size: 1rem; cursor: pointer; }
  button:hover { background: #ff6b35; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #msg { margin: 8px 0; min-height: 1.4em; color: #c0392b; text-align: center; }
  .slider { position: relative; overflow: hidden; border-radius: 16px; background: #000; aspect-ratio: 16/10; }
  .track { display: flex; height: 100%; transition: transform .4s; }
  .track img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.5); padding: 10px 14px; }
  #prev { left: 8px; } #next { right: 8px; }
  .info { text-align: center; margin: 10px 0; }
  .thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .thumbs img { height: 56px; border-radius: 6px; opacity: .5; cursor: pointer; }
  .thumbs img.on { opacity: 1; outline: 2px solid #ff6b35; }
  .pager { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖼️ Pixabay 이미지 슬라이더</h1>

  <div class="bar">
    <input id="key" type="password" placeholder="Pixabay API Key">
  </div>
  <div class="bar">
    <input id="q" type="text" placeholder="검색어 (예: jeju, orange)">
    <button id="go">검색</button>
  </div>
  <div id="msg"></div>

  <div class="slider">
    <div class="track" id="track"></div>
    <button class="arrow" id="prev">◀</button>
    <button class="arrow" id="next">▶</button>
  </div>
  <div class="info" id="info">검색어를 입력하세요</div>
  <div class="thumbs" id="thumbs"></div>
  <div class="pager">
    <button id="pagePrev" disabled>◀ 이전 10개</button>
    <button id="pageNext" disabled>다음 10개 ▶</button>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let hits = [], idx = 0, page = 1, total = 0, query = '';

  $('key').value = localStorage.getItem('pixabayKey') || '';

  async function load(p) {
    const key = $('key').value.trim();
    query = p === 1 ? $('q').value.trim() : query;
    if (!key) return $('msg').textContent = 'API Key를 입력하세요.';
    if (!query) return $('msg').textContent = '검색어를 입력하세요.';
    localStorage.setItem('pixabayKey', key);
    $('msg').textContent = '불러오는 중...';
    try {
      const url = `https://pixabay.com/api/?key=${encodeURIComponent(key)}&q=${encodeURIComponent(query)}&image_type=photo&per_page=10&page=${p}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status === 400 ? 'API Key가 올바르지 않습니다.' : `오류 ${res.status}`);
      const data = await res.json();
      if (!data.hits.length) { $('msg').textContent = '검색 결과가 없습니다.'; return; }
      hits = data.hits; total = data.totalHits; page = p; idx = 0;
      $('msg').textContent = '';
      render();
    } catch (e) {
      $('msg').textContent = e.message;
    }
  }

  function render() {
    $('track').innerHTML = hits.map(h => `<img src="${h.largeImageURL}" alt="${h.tags}">`).join('');
    $('thumbs').innerHTML = hits.map((h, i) => `<img src="${h.previewURL}" data-i="${i}" alt="">`).join('');
    show(0);
    $('pagePrev').disabled = page <= 1;
    $('pageNext').disabled = page * 10 >= total;
  }

  function show(i) {
    idx = (i + hits.length) % hits.length;
    $('track').style.transform = `translateX(-${idx * 100}%)`;
    $('info').textContent = `"${query}" ${(page - 1) * 10 + idx + 1} / ${total} · ${hits[idx].tags} · by ${hits[idx].user}`;
    document.querySelectorAll('.thumbs img').forEach((t, n) => t.classList.toggle('on', n === idx));
  }

  $('go').onclick = () => load(1);
  $('q').addEventListener('keydown', e => e.key === 'Enter' && load(1));
  $('prev').onclick = () => hits.length && show(idx - 1);
  $('next').onclick = () => hits.length && show(idx + 1);
  $('pagePrev').onclick = () => load(page - 1);
  $('pageNext').onclick = () => load(page + 1);
  $('thumbs').onclick = e => e.target.dataset.i && show(+e.target.dataset.i);
</script>
</body>
</html>
