<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three.js 애니메이션</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; font-family: sans-serif; }
  canvas { display: block; }
  #hint { position: fixed; left: 16px; bottom: 12px; color: #9aa4d6; font-size: 13px; pointer-events: none; }
  #space-btn { position: fixed; right: 16px; top: 14px; z-index: 5; font: inherit; font-size: 14px; color: #dfe6ff; background: rgba(16, 20, 44, 0.75); border: 1px solid #3a4585; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
  #space-btn:hover { border-color: #ffb454; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<button id="space-btn" type="button" onclick="location.href='space.html'">우주 보기 🚀</button>
<div id="hint">드래그: 회전 · 휠: 확대/축소</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060f, 0.025);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

// 중앙 토러스 매듭
const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(2, 0.6, 220, 32),
  new THREE.MeshStandardMaterial({ color: 0x6c8cff, metalness: 0.7, roughness: 0.25 })
);
scene.add(knot);

// 궤도를 도는 구체들
const orbiters = [];
for (let i = 0; i < 6; i++) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 32, 32),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(i / 6, 0.9, 0.6),
      emissive: new THREE.Color().setHSL(i / 6, 0.9, 0.3),
      metalness: 0.3, roughness: 0.3
    })
  );
  scene.add(mesh);
  orbiters.push({ mesh, radius: 4.5 + (i % 3) * 0.8, speed: 0.5 + i * 0.12, tilt: i * 0.5, phase: i });
}

// 별 파티클
const N = 2500;
const pos = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const r = 20 + Math.random() * 60;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
  pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
  pos[i * 3 + 2] = r * Math.cos(ph);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, sizeAttenuation: true }));
scene.add(stars);

// 조명
scene.add(new THREE.AmbientLight(0x404060, 1.2));
const l1 = new THREE.PointLight(0xff5ca8, 80, 40);
const l2 = new THREE.PointLight(0x4cf0ff, 80, 40);
scene.add(l1, l2);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();

  knot.rotation.x = t * 0.3;
  knot.rotation.y = t * 0.5;
  const s = 1 + Math.sin(t * 1.5) * 0.06;
  knot.scale.set(s, s, s);

  for (const o of orbiters) {
    const a = t * o.speed + o.phase;
    o.mesh.position.set(
      Math.cos(a) * o.radius,
      Math.sin(a * 1.3) * 1.5,
      Math.sin(a) * o.radius
    );
    o.mesh.position.applyAxisAngle(new THREE.Vector3(1, 0, 0), o.tilt);
  }

  l1.position.set(Math.cos(t) * 7, Math.sin(t * 0.7) * 4, Math.sin(t) * 7);
  l2.position.set(-Math.cos(t * 0.8) * 7, Math.cos(t * 0.5) * 4, -Math.sin(t * 0.8) * 7);

  stars.rotation.y = t * 0.01;

  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
